<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣標準時間 (UTC+8) | 即時時鐘</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Share Tech Mono (科技感時鐘字體) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                            glow: '#00f2fe'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* 背景網格與發光效果 */
        body {
            background-color: #0b0f19;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(20, 184, 166, 0.15), transparent 70%),
                radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.08), transparent 50%);
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(20, 184, 166, 0.6), 0 0 40px rgba(0, 242, 254, 0.2);
        }

        .text-glow-subtle {
            text-shadow: 0 0 10px rgba(20, 184, 166, 0.4);
        }

        /* 秒訊脈動環 */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .pulse-ring {
            animation: pulse-ring 2s infinite ease-in-out;
        }

        /* 複製提示訊息 */
        .toast {
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform: translateY(100px);
            opacity: 0;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 font-sans antialiased selection:bg-brand-500 selection:text-white">

    <!-- 頂部列：標題與時區標籤 -->
    <header class="w-full max-w-4xl flex flex-col sm:flex-row justify-between items-center gap-4 py-4 border-b border-slate-800/80">
        <div class="flex items-center gap-3">
            <div class="relative flex items-center justify-center">
                <span class="w-3 h-3 bg-brand-500 rounded-full animate-ping absolute"></span>
                <span class="w-3 h-3 bg-brand-500 rounded-full relative"></span>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold tracking-wider text-slate-100">
                台灣標準時間 <span class="text-xs font-normal text-slate-400 px-2 py-0.5 rounded bg-slate-800/80 border border-slate-700/50">中原標準時間</span>
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <span class="px-3 py-1 rounded-full text-xs font-mono font-medium bg-brand-900/40 text-brand-500 border border-brand-500/30 flex items-center gap-1.5">
                <i class="fa-solid fa-earth-asia"></i> UTC+8 (TST/CST)
            </span>
        </div>
    </header>

    <!-- 主體內容卡片 -->
    <main class="w-full max-w-4xl my-auto py-8">
        <div class="glass-panel rounded-3xl p-6 sm:p-12 relative overflow-hidden text-center">
            
            <!-- 背景裝飾視覺 -->
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <!-- 控制列 (開關選項) -->
            <div class="flex flex-wrap justify-end items-center gap-3 mb-6 sm:mb-10 text-xs sm:text-sm text-slate-400">
                <!-- 毫秒顯示切換 -->
                <button id="toggleMsBtn" onclick="toggleMilliseconds()" class="px-3 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-700/60 border border-slate-700/50 transition-colors flex items-center gap-2">
                    <i class="fa-regular fa-clock"></i>
                    <span>顯示毫秒: <span id="msStatus" class="text-brand-500 font-semibold">開啟</span></span>
                </button>

                <!-- 12/24 小時制切換 -->
                <button id="toggleFormatBtn" onclick="toggleTimeFormat()" class="px-3 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-700/60 border border-slate-700/50 transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i>
                    <span id="formatText">切換為 12 小時制</span>
                </button>
            </div>

            <!-- 日期與農曆/星期顯示 -->
            <div class="space-y-2 mb-6 sm:mb-8">
                <div id="dateDisplay" class="text-lg sm:text-2xl font-medium tracking-wide text-slate-300">
                    ---- 年 -- 月 -- 日
                </div>
                <div class="flex items-center justify-center gap-3 text-sm sm:text-base text-brand-500 font-medium">
                    <span id="dayOfWeekDisplay" class="px-2.5 py-0.5 rounded bg-brand-500/10 border border-brand-500/20">星期-</span>
                    <span id="periodDisplay" class="hidden px-2.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">AM</span>
                </div>
            </div>

            <!-- 核心數位時鐘顯示區 -->
            <div class="my-4 sm:my-8 py-2">
                <div class="font-mono text-5xl sm:text-7xl md:text-8xl font-bold tracking-tight text-white text-glow flex items-baseline justify-center flex-wrap gap-1 sm:gap-2">
                    <span id="hoursMinutes">00:00</span>
                    <span class="text-3xl sm:text-5xl md:text-6xl text-brand-500 font-normal">:</span>
                    <span id="seconds" class="text-3xl sm:text-5xl md:text-6xl text-brand-500 font-normal">00</span>
                    <span id="milliseconds" class="text-xl sm:text-3xl text-slate-500 font-light w-12 sm:w-16 text-left ml-1">.00</span>
                </div>
            </div>

            <!-- 視覺脈動秒針進度條 -->
            <div class="w-full max-w-md mx-auto my-6 bg-slate-800/80 rounded-full h-1.5 overflow-hidden p-0.5 border border-slate-700/30">
                <div id="secondProgressBar" class="bg-gradient-to-r from-brand-600 to-brand-glow h-full rounded-full transition-all duration-100 ease-linear" style="width: 0%;"></div>
            </div>

            <!-- 操作按鈕區 -->
            <div class="mt-8 sm:mt-10 flex justify-center gap-4">
                <button onclick="copyTimeToClipboard()" class="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-medium shadow-lg shadow-brand-600/30 hover:shadow-brand-500/50 transition-all transform active:scale-95 flex items-center gap-2">
                    <i class="fa-regular fa-copy"></i>
                    <span>複製精確時間</span>
                </button>
            </div>

        </div>
    </main>

    <!-- 頁尾資訊 -->
    <footer class="w-full max-w-4xl py-4 text-center text-xs text-slate-500 border-t border-slate-800/80 flex flex-col sm:flex-row justify-between items-center gap-2">
        <div>
            &copy; <span id="year"></span> 台灣標準時間 National Standard Time
        </div>
        <div class="flex items-center gap-4 text-slate-400">
            <span>精確度：系統同步 (NTP)</span>
            <span>•</span>
            <span>時區：Asia/Taipei</span>
        </div>
    </footer>

    <!-- 複製成功的 Toast 提示 -->
    <div id="toast" class="toast fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white border border-brand-500/40 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-50">
        <i class="fa-solid fa-circle-check text-brand-500 text-lg"></i>
        <span id="toastMessage">已成功複製時間至剪貼簿！</span>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 狀態設定
        let is24HourFormat = true;
        let showMilliseconds = true;

        // 星期名稱對照
        const daysInChinese = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

        // 更新頁尾年份
        document.getElementById('year').textContent = new Date().getFullYear();

        // 格式化數字補零 (例如 5 -> "05")
        function padZero(num, size = 2) {
            let s = num + "";
            while (s.length < size) s = "0" + s;
            return s;
        }

        // 時鐘主要更新函式
        function updateClock() {
            const now = new Date();

            // 1. 日期部分 (西元 年/月/日)
            const year = now.getFullYear();
            const month = padZero(now.getMonth() + 1);
            const date = padZero(now.getDate());
            const dayOfWeek = daysInChinese[now.getDay()];

            document.getElementById('dateDisplay').textContent = `${year} 年 ${month} 月 ${date} 日`;
            document.getElementById('dayOfWeekDisplay').textContent = dayOfWeek;

            // 2. 時間計算
            let hours = now.getHours();
            const minutes = padZero(now.getMinutes());
            const seconds = padZero(now.getSeconds());
            const milliseconds = padZero(Math.floor(now.getMilliseconds() / 10)); // 取得百萬分之十秒 (兩位數)

            const periodDisplay = document.getElementById('periodDisplay');
            
            if (!is24HourFormat) {
                // 12 小時制邏輯
                const period = hours >= 12 ? '下午 PM' : '上午 AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // 0 時應顯示為 12
                
                periodDisplay.textContent = period;
                periodDisplay.classList.remove('hidden');
            } else {
                periodDisplay.classList.add('hidden');
            }

            const formattedHours = padZero(hours);

            // 3. 更新渲染 DOM
            document.getElementById('hoursMinutes').textContent = `${formattedHours}:${minutes}`;
            document.getElementById('seconds').textContent = seconds;
            
            const msElement = document.getElementById('milliseconds');
            if (showMilliseconds) {
                msElement.textContent = `.${milliseconds}`;
                msElement.style.display = 'inline-block';
            } else {
                msElement.style.display = 'none';
            }

            // 4. 秒數進度條 (0-59 秒百分比 + 毫秒平滑度)
            const currentSecondProgress = ((now.getSeconds() + now.getMilliseconds() / 1000) / 60) * 100;
            document.getElementById('secondProgressBar').style.width = `${currentSecondProgress}%`;

            // 使用 requestAnimationFrame 實現高頻率順暢更新
            requestAnimationFrame(updateClock);
        }

        // 切換 12/24 小時制
        function toggleTimeFormat() {
            is24HourFormat = !is24HourFormat;
            const btnText = document.getElementById('formatText');
            btnText.textContent = is24HourFormat ? '切換為 12 小時制' : '切換為 24 小時制';
        }

        // 切換毫秒顯示
        function toggleMilliseconds() {
            showMilliseconds = !showMilliseconds;
            const statusText = document.getElementById('msStatus');
            statusText.textContent = showMilliseconds ? '開啟' : '關閉';
            statusText.className = showMilliseconds ? 'text-brand-500 font-semibold' : 'text-slate-500 font-semibold';
        }

        // 一鍵複製精確時間
        function copyTimeToClipboard() {
            const now = new Date();
            const year = now.getFullYear();
            const month = padZero(now.getMonth() + 1);
            const date = padZero(now.getDate());
            const hours = padZero(now.getHours());
            const minutes = padZero(now.getMinutes());
            const seconds = padZero(now.getSeconds());
            const dayOfWeek = daysInChinese[now.getDay()];

            const fullTimeString = `${year}-${month}-${date} ${hours}:${minutes}:${seconds} (台灣標準時間 ${dayOfWeek})`;

            // 複製到剪貼簿 (相容性備援處理)
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(fullTimeString).then(showToast);
            } else {
                // 傳統寫法
                const textArea = document.createElement("textarea");
                textArea.value = fullTimeString;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('複製失敗: ', err);
                }
                document.body.removeChild(textArea);
            }
        }

        // 顯示複製成功的提示
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 啟動時鐘
        requestAnimationFrame(updateClock);
    </script>
</body>
</html>
